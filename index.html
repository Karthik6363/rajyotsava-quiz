<head>
<meta charset="utf-8">

<title>Rajyotsava MCQ Practice</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@600;800&family=Inter:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&display=swap">
<style>
/* Layout: single centred card app — setup → question → results; Karnataka yellow/red on warm paper */
:root{
  --bg:#fbf8f1; --surface:#ffffff; --fg:#26201a; --muted:#6d6257; --line:#e5dccb;
  --red:#b3261e; --yellow:#e9b200; --yellow-soft:#fff3c4; --chip:#f3ece0;
  --ok:#1f7a3f; --ok-soft:#dff3e6; --bad:#b3261e; --bad-soft:#fbe1de;
  --display:"Baloo Tamma 2","Noto Sans Kannada",system-ui,sans-serif;
  --body:"Inter","Noto Sans Kannada",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#211c17; --fg:#f2ebe0; --muted:#b3a796; --line:#3a3128;
  --red:#ff7a6e; --yellow:#f2c230; --yellow-soft:#3a2f0e; --chip:#2c251e;
  --ok:#6fd598; --ok-soft:#173623; --bad:#ff8a7e; --bad-soft:#3d1a16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#211c17; --fg:#f2ebe0; --muted:#b3a796; --line:#3a3128;
  --red:#ff7a6e; --yellow:#f2c230; --yellow-soft:#3a2f0e; --chip:#2c251e;
  --ok:#6fd598; --ok-soft:#173623; --bad:#ff8a7e; --bad-soft:#3d1a16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:grid;gap:16px}
.flag{display:flex;height:6px;width:64px;border-radius:3px;overflow:hidden}
.flag i{flex:1}.flag i:first-child{background:var(--yellow)}.flag i:last-child{background:var(--red)}
h1{font:800 clamp(26px,6vw,36px)/1.15 var(--display);margin:8px 0 0;text-wrap:balance}
h1 span{color:var(--red)}
h2{font:800 20px/1.25 var(--display);margin:0}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:7px 12px;font:500 13px/1.4 var(--body);cursor:pointer}
.chip small{color:var(--muted);font-weight:400}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip[aria-pressed="true"] small{color:#ffe1dd}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font:600 15px var(--body);cursor:pointer;background:var(--red);color:#fff}
.btn.ghost{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.note{background:var(--yellow-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.note b{color:var(--red)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--yellow);transition:width .2s}
.topic{font-size:12px;letter-spacing:.04em;color:var(--red);font-weight:600}
.qtext{font:600 19px/1.5 var(--body);margin:0;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:11px 12px;font:500 15px/1.45 var(--body);cursor:pointer}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--chip);font-weight:600;font-size:13px;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.fb{border-radius:10px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft);color:var(--fg)}
.fb.no{background:var(--bad-soft);color:var(--fg)}
.fb b{font-weight:600}
.timer{font-weight:600;color:var(--fg)}
.timer.low{color:var(--bad)}
.score{font:800 56px/1 var(--display);color:var(--red);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{grid-column:1/-1;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--ok)}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.review{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.review li{border-left:3px solid var(--bad);padding:6px 10px;background:var(--chip);border-radius:0 8px 8px 0;font-size:14px}
.review li .a{color:var(--ok);font-weight:600}
.review li .y{color:var(--bad)}
.kbd{font-size:12px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="flag"><i></i><i></i></div>
    <h1 id="h1"></h1>
    <p class="muted" id="sub" style="margin:6px 0 0"></p>
  </header>

  <section id="setup" class="card">
    <div class="note" id="note"></div>
    <div>
      <div class="label">ಭಾಷೆ / Language</div>
      <div class="chips" id="langs">
        <button class="chip" data-l="kn">ಕನ್ನಡ</button>
        <button class="chip" data-l="en">English</button>
      </div>
    </div>
    <div><div class="label" id="lTopic"></div><div class="chips" id="topics"></div></div>
    <div><div class="label" id="lCount"></div><div class="chips" id="counts"></div></div>
    <div>
      <div class="label" id="lOpts"></div>
      <div class="chips">
        <button class="chip" id="optStar" aria-pressed="false"></button>
        <button class="chip" id="optTimer" aria-pressed="false"></button>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="start"></button>
      <button class="btn ghost" id="weak" hidden></button>
      <span class="muted" id="pool" style="font-size:13px"></span>
    </div>
    <div class="muted" id="best" style="font-size:13px"></div>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="top"><span id="qnum"></span><span id="timer" class="timer"></span><span id="live"></span></div>
    <div class="prog"><i id="progbar" style="width:0"></i></div>
    <div class="topic" id="qtopic"></div>
    <p class="qtext" id="qtext"></p>
    <div class="opts" id="opts"></div>
    <div id="fb" class="fb" hidden></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="quit"></button>
      <button class="btn" id="next" hidden></button>
    </div>
    <div class="muted kbd" id="keys"></div>
  </section>

  <section id="results" class="card" hidden>
    <div class="label" id="lScore"></div>
    <div class="row" style="align-items:baseline;gap:12px"><div class="score" id="score"></div><div class="muted" id="scoreTxt"></div></div>
    <div class="bars" id="bars"></div>
    <div class="row">
      <button class="btn" id="retryWrong"></button>
      <button class="btn ghost" id="again"></button>
    </div>
    <div id="revWrap">
      <h2 id="lReview" style="margin-bottom:8px"></h2>
      <ul class="review" id="review"></ul>
    </div>
  </section>
</div>

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("rq_lang","kn"); if(lang!=="en"&&lang!=="kn")lang="kn";
let topic="ALL", count=20, starOnly=false, timerOn=false;
let deck=[], idx=0, right=0, answers=[], tHandle=null, tLeft=0;
const t=()=>T[lang], TN=()=>TOPIC_NAMES[lang], ON=()=>OWNER_NAMES[lang];

// one question in the current language: [question, correct, w1, w2, w3, note]
function qtext(i){return lang==="kn"?QK[i]:[Q[i][2],Q[i][3],Q[i][4],Q[i][5],Q[i][6],Q[i][7]];}
function pool(){return Q.map((q,i)=>i).filter(i=>(topic==="ALL"||Q[i][0]===topic)&&(!starOnly||Q[i][1]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function applyLang(){
  document.documentElement.lang=lang;
  $("h1").innerHTML=t().h1; $("sub").textContent=t().sub; $("note").innerHTML=t().note;
  $("lTopic").textContent=t().topic; $("lCount").textContent=t().count; $("lOpts").textContent=t().opts;
  $("optStar").textContent=t().star; $("optTimer").textContent=t().timer; $("start").textContent=t().start;
  $("quit").textContent=t().quit; $("keys").textContent=t().keys; $("lScore").textContent=t().score;
  $("retryWrong").textContent=t().retry; $("again").textContent=t().again; $("lReview").textContent=t().review;
  [...$("langs").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  renderSetup();
}
function renderSetup(){
  const ts=[["ALL",t().all,Q.length]].concat(Object.keys(TN()).map(k=>[k,TN()[k]+" · "+ON()[k],Q.filter(q=>q[0]===k).length]));
  $("topics").innerHTML=ts.map(([k,n,c])=>`<button class="chip" data-t="${k}" aria-pressed="${k===topic}">${n} <small>${c}</small></button>`).join("");
  $("counts").innerHTML=[10,20,50,0].map(n=>`<button class="chip" data-c="${n}" aria-pressed="${n===count}">${n||t().allN}</button>`).join("");
  const p=pool().length; $("pool").textContent=t().pool(p); $("start").disabled=!p;
  const wrong=store.get("rq_wrong",[]).filter(i=>i<Q.length);
  $("weak").hidden=!wrong.length; $("weak").textContent=t().weak(wrong.length);
  const b=store.get("rq_best",null); $("best").textContent=b?t().best(b.pct,b.r,b.n):"";
}
$("langs").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;lang=b.dataset.l;store.set("rq_lang",lang);applyLang();};
$("topics").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;topic=b.dataset.t;renderSetup();};
$("counts").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;count=+b.dataset.c;renderSetup();};
$("optStar").onclick=()=>{starOnly=!starOnly;$("optStar").setAttribute("aria-pressed",starOnly);renderSetup();};
$("optTimer").onclick=()=>{timerOn=!timerOn;$("optTimer").setAttribute("aria-pressed",timerOn);};

function begin(ids){
  // o holds option slots 1..4 of qtext(); slot 1 is always the correct answer
  deck=ids.map(i=>({i,t:Q[i][0],o:shuffle([1,2,3,4])}));
  idx=0;right=0;answers=[];
  $("setup").hidden=true;$("results").hidden=true;$("quiz").hidden=false;show();
}
$("start").onclick=()=>{let ids=shuffle(pool());if(count)ids=ids.slice(0,count);begin(ids);};
$("weak").onclick=()=>begin(shuffle(store.get("rq_wrong",[]).filter(i=>i<Q.length)));

function show(){
  const d=deck[idx], q=qtext(d.i);
  $("qnum").textContent=t().qnum(idx+1,deck.length);
  $("live").textContent=t().live(right);
  $("progbar").style.width=(idx/deck.length*100)+"%";
  $("qtopic").textContent=TN()[d.t];
  $("qtext").textContent=q[0];
  $("opts").innerHTML=d.o.map((s,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span></span></button>`).join("");
  [...$("opts").children].forEach((b,k)=>b.lastChild.textContent=q[d.o[k]]);
  $("fb").hidden=true;$("next").hidden=true;
  clearInterval(tHandle);$("timer").textContent="";
  if(timerOn){tLeft=15;tick();tHandle=setInterval(()=>{tLeft--;tick();if(tLeft<=0){clearInterval(tHandle);pick(-1);}},1000);}
  $("opts").firstChild.focus({preventScroll:true});
}
function tick(){$("timer").textContent=`⏱ ${tLeft}s`;$("timer").classList.toggle("low",tLeft<=5);}
function pick(k){
  const d=deck[idx], q=qtext(d.i); if(!$("next").hidden)return; clearInterval(tHandle);
  const slot=k>=0?d.o[k]:0, ok=slot===1;
  if(ok)right++;
  answers.push({d,slot,ok});
  [...$("opts").children].forEach((b,j)=>{b.disabled=true;if(d.o[j]===1)b.classList.add("right");else if(j===k)b.classList.add("wrong");});
  const fb=$("fb");fb.hidden=false;fb.className="fb "+(ok?"ok":"no");fb.innerHTML="";
  const s=document.createElement("b");s.textContent=ok?t().ok:(k<0?t().time:t().no)+t().ans+q[1]+". ";fb.appendChild(s);
  if(q[5])fb.appendChild(document.createTextNode(q[5]));
  $("live").textContent=t().live(right);
  $("next").hidden=false;$("next").textContent=idx===deck.length-1?t().results:t().next;$("next").focus({preventScroll:true});
}
$("opts").onclick=e=>{const b=e.target.closest(".opt");if(b&&!b.disabled)pick(+b.dataset.k);};
$("next").onclick=()=>{if(idx<deck.length-1){idx++;show();}else finish();};
$("quit").onclick=()=>{clearInterval(tHandle);if(answers.length)finish();else{$("quiz").hidden=true;$("setup").hidden=false;renderSetup();}};
document.addEventListener("keydown",e=>{
  if($("quiz").hidden)return;
  if(/^[1-4]$/.test(e.key)&&$("next").hidden){pick(+e.key-1);}
  else if(e.key==="Enter"&&!$("next").hidden&&document.activeElement!==$("next")){e.preventDefault();$("next").click();}
});

function finish(){
  clearInterval(tHandle);
  const n=answers.length, pct=n?Math.round(right/n*100):0;
  $("quiz").hidden=true;$("results").hidden=false;
  $("score").textContent=pct+"%";
  $("scoreTxt").textContent=t().scoreTxt(right,n)+(pct>=80?t().ready:pct>=60?t().nearly:t().keep);
  const by={};answers.forEach(a=>{(by[a.d.t]=by[a.d.t]||{r:0,n:0}).n++;if(a.ok)by[a.d.t].r++;});
  $("bars").innerHTML=Object.keys(TN()).filter(k=>by[k]).map(k=>`<div class="bar"><span>${TN()[k]} <span class="muted">· ${ON()[k]}</span></span><span class="n">${by[k].r}/${by[k].n}</span><span class="track"><i style="width:${by[k].r/by[k].n*100}%"></i></span></div>`).join("");
  const missed=answers.filter(a=>!a.ok);
  let wrong=new Set(store.get("rq_wrong",[]));answers.forEach(a=>a.ok?wrong.delete(a.d.i):wrong.add(a.d.i));store.set("rq_wrong",[...wrong]);
  const best=store.get("rq_best",null);if(n>=10&&(!best||pct>best.pct))store.set("rq_best",{pct,r:right,n});
  $("revWrap").hidden=!missed.length;$("retryWrong").hidden=!missed.length;
  const ul=$("review");ul.innerHTML="";
  missed.forEach(a=>{const q=qtext(a.d.i),li=document.createElement("li");
    li.innerHTML=`<div></div><div><span class="a"></span> <span class="y"></span></div>`;
    li.children[0].textContent=q[0];li.querySelector(".a").textContent="✓ "+q[1];
    li.querySelector(".y").textContent=a.slot?t().said+q[a.slot]:t().none;ul.appendChild(li);});
  $("retryWrong").onclick=()=>begin(shuffle(missed.map(a=>a.d.i)));
}
$("again").onclick=()=>{$("results").hidden=true;$("setup").hidden=false;renderSetup();};
applyLang();
</script>
